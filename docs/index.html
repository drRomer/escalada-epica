<script>
"use strict";
// ---- core.js ----
// ===== CORE: física y nivel (Cuentos del Medioevo: Escalada Épica) (sin dependencias de render; reutilizable en Node para el verificador) =====
const CORE = (function () {
  const T = 12;            // tamaño de tile en px internos
  const W = 16;            // ancho del nivel en tiles
  const PW = 8, PH = 14;   // hitbox del escalador
  const K = {
    GRAV: 900, MAX_FALL: 240, RUN: 78,
    ACC_G: 1000, DEC_G: 1300, ACC_A: 650, DEC_A: 420,
    ICE_ACC: 220, ICE_DEC: 70,
    JUMP_V: 262, CUT: 2.4, COYOTE: 0.09, BUFFER: 0.12,
    WJ_VX: 105, WJ_VY: 240, WJ_LOCK: 0.16,
    CJ_VY: 230, CJ_COST: 27.5,
    CLIMB_UP: 46, CLIMB_DOWN: 72,
    ST_MAX: 110, ST_HOLD: 10, ST_UP: 28,
    SLIDE_MAX: 55, ICE_SLIDE: 140,
    HOP_VY: 150, HOP_VX: 60,
    ROPE_UP: 55, ROPE_DOWN: 80, ROPE_REGEN: 45,
    CATCH_FALL: 84,
    LEV_T: 1.0, LEV_VY: 38
  };

  function parseLevel(def) {
    const rows = def.map;
    const H = rows.length;
    const grid = [];
    const e = { start: null, flag: null, seguros: [], crystals: [], chalk: [], rocks: [], icicles: [], condors: [], signs: [], goblins: [], vents: [], runes: [], swoops: [], ghosts: [], saws: [], lobbers: [], hearts: [], powers: [] };
    for (let r = 0; r < H; r++) {
      const row = rows[r];
      if (row.length !== W) throw new Error(def.name + ': fila ' + r + ' tiene ' + row.length + ' columnas: "' + row + '"');
      const g = [];
      for (let c = 0; c < W; c++) {
        const ch = row[c];
        let keep = '.';
        const cx = c * T, cy = r * T;
        switch (ch) {
          case 'S': e.start = { c, r, x: cx + T / 2 - PW / 2, y: cy + T - PH }; break;
          case 'F': e.flag = { c, r, x: cx, y: cy }; break;
          case 'P': e.seguros.push({ c, r, x: cx + T / 2 - PW / 2, y: cy + T - PH, ax: cx + T / 2, ay: cy + T - 9 }); break;
          case 'o': e.crystals.push({ c, r, x: cx + 3, y: cy + 3 }); break;
          case 'm': e.chalk.push({ c, r, x: cx + 2, y: cy + 2 }); break;
          case 'R': e.rocks.push({ c, r, x: cx, y: cy }); break;
          case 'V': e.icicles.push({ c, r, x: cx, y: cy }); break;
          case 'Y': e.condors.push({ c, r, x: cx, y: cy }); break;
          case 'T': e.signs.push({ c, r, x: cx, y: cy }); break;
          case 'A': e.goblins.push({ c, r, x: cx, y: cy }); break;
          case 'H': e.vents.push({ c, r, x: cx, y: cy }); break;
          case 'U': e.runes.push({ c, r, x: cx, y: cy }); break;
          case 'W': e.swoops.push({ c, r, x: cx, y: cy }); break;
          case 'G': e.ghosts.push({ c, r, x: cx, y: cy }); break;
          case 'O': e.saws.push({ c, r, x: cx, y: cy }); break;
          case 'M': e.lobbers.push({ c, r, x: cx, y: cy }); break;
          case 'Q': e.hearts.push({ c, r, x: cx, y: cy }); break;
          case 'D': e.powers.push({ c, r, x: cx, y: cy }); break;
          default: keep = ch;
        }
        g.push(keep);
      }
      grid.push(g);
    }
    if (!e.start) throw new Error(def.name + ': falta S');
    if (!e.flag) throw new Error(def.name + ': falta F');
    e.signs.sort((a, b) => b.r - a.r || a.c - b.c);          // de abajo hacia arriba = orden de juego
    e.seguros.sort((a, b) => b.r - a.r);
    return { W, H, grid, e, def, crumble: {}, name: def.name };
  }

  function tile(L, c, r) {
    if (c < 0 || c >= W) return 'Z';
    if (r < 0 || r >= L.H) return '.';
    return L.grid[r][c];
  }
  function crumbleGone(L, c, r) { const s = L.crumble[r * W + c]; return !!(s && s.gone); }
  function solid(L, c, r) {
    const ch = tile(L, c, r);
    if (ch === '#' || ch === 'Z' || ch === 'I') return true;
    if (ch === 'C') return !crumbleGone(L, c, r);
    return false;
  }
  function grabbable(L, c, r) {
    const ch = tile(L, c, r);
    if (ch === '#') return true;
    if (ch === 'C') return !crumbleGone(L, c, r);
    return false;
  }
  function isIce(L, c, r) { return tile(L, c, r) === 'I'; }
  // 'B': plataforma de luz. Filas pares e impares alternan (periodo 3 s, encendida 2 s)
  function blinkPhase(L, r) { return L.clock === undefined ? 0 : (L.clock + (r % 2) * 1.5) % 3; }
  function blinkOn(L, r) { return blinkPhase(L, r) < 2; }
  function oneWay(L, c, r) { const ch = tile(L, c, r); return ch === '=' || (ch === 'B' && blinkOn(L, r)); }
  // 'X': púas retráctiles (ciclo 2,4 s desfasado por columna; salidas de 1,5 a 2,4)
  function spikePhase(L, c) { return L.clock === undefined ? 0 : (L.clock + c * 0.3) % 2.4; }
  function spikeOut(L, c) { return spikePhase(L, c) >= 1.5; }
  function rectAny(L, x, y, w, h, fn) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + w - 0.001) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + h - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (fn(L, c, r)) return true;
    return false;
  }
  function rectEach(L, x, y, w, h, cb) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + w - 0.001) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + h - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) cb(c, r);
  }

  function newPlayer(x, y) {
    return {
      x, y, vx: 0, vy: 0, state: 'normal', facing: 1, stamina: K.ST_MAX, onGround: false, ice: false,
      coyote: 0, buf: 0, wjLock: 0, hop: 0, ropeCd: 0, drop: 0, regrab: false, apexY: y, lev: false, levT: 0, levUsed: false
    };
  }
  function clonePlayer(p) { return Object.assign({}, p); }

  function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }

  function moveX(L, p, dx) {
    if (!dx) return false;
    p.x += dx;
    if (rectAny(L, p.x, p.y, PW, PH, solid)) {
      if (dx > 0) p.x = Math.floor((p.x + PW - 0.001) / T) * T - PW;
      else p.x = (Math.floor(p.x / T) + 1) * T;
      p.vx = 0;
      return true;
    }
    return false;
  }
  function moveY(L, p, dy) {
    if (!dy) return false;
    const oldBottom = p.y + PH;
    p.y += dy;
    if (rectAny(L, p.x, p.y, PW, PH, solid)) {
      if (dy > 0) p.y = Math.floor((p.y + PH - 0.001) / T) * T - PH;
      else p.y = (Math.floor(p.y / T) + 1) * T;
      p.vy = 0;
      return true;
    }
    if (dy > 0 && p.drop <= 0 && p.state !== 'rope') {
      const nb = p.y + PH;
      const r = Math.floor((nb - 0.001) / T);
      const top = r * T;
      if (oldBottom <= top + 0.01 && nb > top) {
        const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + PW - 0.001) / T);
        for (let c = c0; c <= c1; c++) if (oneWay(L, c, r)) { p.y = top - PH; p.vy = 0; return true; }
      }
    }
    return false;
  }

  // inp: {left,right,up,down,jump,jumpPressed,grab}; env: {wind, onTouch(c,r), ev(name)}
  function step(L, p, inp, dt, env) {
    const ev = env.ev || noop;
    const dirX = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    const dirY = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
    p.coyote -= dt; p.buf -= dt; p.wjLock -= dt; p.hop -= dt; p.ropeCd -= dt; p.drop -= dt;
    if (inp.jumpPressed) p.buf = K.BUFFER;

    // --- suelo
    p.onGround = false; p.ice = false;
    let oneWayOnly = true;
    if (p.vy >= 0 && p.state !== 'rope') {
      const feet = p.y + PH;
      const r = Math.round(feet / T);
      if (Math.abs(feet - r * T) < 0.6) {
        const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + PW - 0.001) / T);
        for (let c = c0; c <= c1; c++) {
          if (solid(L, c, r)) {
            p.onGround = true; oneWayOnly = false;
            if (isIce(L, c, r)) p.ice = true;
            if (tile(L, c, r) === 'C' && env.onTouch) env.onTouch(c, r);
          } else if (oneWay(L, c, r) && p.drop <= 0) p.onGround = true;
        }
      }
    }
    if (p.state === 'rope' && p.vy >= 0) {
      // permitir bajar de la cuerda al suelo
      const feet = p.y + PH, r = Math.round(feet / T);
      if (Math.abs(feet - r * T) < 0.6 && rectAny(L, p.x, feet, PW, 1, solid)) p.onGround = true;
    }

    // --- paredes
    const touchR = rectAny(L, p.x + PW, p.y + 2, 1, PH - 4, solid);
    const touchL = rectAny(L, p.x - 1, p.y + 2, 1, PH - 4, solid);
    const nearR = touchR || rectAny(L, p.x + PW, p.y + 2, 3, PH - 4, solid);
    const nearL = touchL || rectAny(L, p.x - 3, p.y + 2, 3, PH - 4, solid);
    const grabR = rectAny(L, p.x + PW, p.y + 2, 1, PH - 6, grabbable);
    const grabL = rectAny(L, p.x - 1, p.y + 2, 1, PH - 6, grabbable);

    if (p.state === 'normal') {
      if (p.onGround) { p.coyote = K.COYOTE; p.stamina = K.ST_MAX; p.regrab = false; p.levUsed = false; p.levT = 0; }
      // horizontal
      if (p.wjLock <= 0) {
        let acc;
        if (p.onGround) acc = p.ice ? (dirX ? K.ICE_ACC : K.ICE_DEC) : (dirX ? K.ACC_G : K.DEC_G);
        else acc = dirX ? K.ACC_A : K.DEC_A;
        p.vx = approach(p.vx, dirX * K.RUN, acc * dt);
        if (dirX) p.facing = dirX;
      }
      if (env.wind) {
        p.vx += env.wind * (p.onGround ? 0.3 : 1) * dt;
        const lim = K.RUN * 1.7; if (p.vx > lim) p.vx = lim; if (p.vx < -lim) p.vx = -lim;
      }
      // salto
      if (p.buf > 0) {
        if (p.onGround && dirY > 0 && oneWayOnly) { p.drop = 0.2; p.buf = 0; p.onGround = false; }
        else if (p.coyote > 0) { p.vy = -K.JUMP_V; p.coyote = 0; p.buf = 0; p.onGround = false; ev('jump'); }
        else if (nearR || nearL) {
          const away = (nearR && nearL) ? -p.facing : (nearR ? -1 : 1);
          p.vx = away * K.WJ_VX; p.vy = -K.WJ_VY; p.wjLock = K.WJ_LOCK; p.facing = away; p.buf = 0; p.regrab = false;
          ev('walljump');
        } else if (p.lev && !p.levUsed) { p.levT = K.LEV_T; p.levUsed = true; p.buf = 0; ev('lev'); }
      }
      // gravedad
      if (!p.onGround && p.levT > 0) {
        if (inp.jump) { p.vy = approach(p.vy, -K.LEV_VY, 1200 * dt); p.levT -= dt; } else p.levT = 0;
      } else if (!p.onGround) {
        let g = K.GRAV;
        if (p.vy < 0 && !inp.jump && !p.regrab) g *= K.CUT;
        else if (Math.abs(p.vy) < 45 && inp.jump) g *= 0.55;
        p.vy += g * dt;
        let maxF = K.MAX_FALL;
        if (p.vy > 0 && dirX !== 0 && ((dirX > 0 && touchR) || (dirX < 0 && touchL))) {
          const iceWall = dirX > 0 ? rectAny(L, p.x + PW, p.y + 2, 1, PH - 4, isIce) : rectAny(L, p.x - 1, p.y + 2, 1, PH - 4, isIce);
          maxF = iceWall ? K.ICE_SLIDE : K.SLIDE_MAX;
        }
        if (p.vy > maxF) p.vy = approach(p.vy, maxF, 1800 * dt);
      } else if (p.vy > 0) p.vy = 0;
      // agarre
      let side = dirX !== 0 ? dirX : p.facing;
      if (dirX === 0 && dirY < 0) { if (grabR && !grabL) side = 1; else if (grabL && !grabR) side = -1; }
      const canGrab = side > 0 ? grabR : grabL;
      const want = inp.grab || p.regrab || (!p.onGround && dirX === side && dirX !== 0) || dirY < 0;
      if (want && canGrab && p.stamina > 0 && p.hop <= 0 && p.vy >= -40) {
        p.state = 'climb'; p.facing = side; p.vx = 0; p.vy = 0; p.regrab = false; p.levT = 0; p.levUsed = false; ev('grab');
      }
      // cuerda fija
      if (p.state === 'normal' && p.ropeCd <= 0 && (dirY < 0 || (dirY > 0 && !p.onGround))) {
        const cx = p.x + PW / 2, c = Math.floor(cx / T), r = Math.floor((p.y + PH / 2) / T);
        if (tile(L, c, r) === '|' && Math.abs(cx - (c * T + T / 2)) < 6) {
          p.state = 'rope'; p.x = c * T + T / 2 - PW / 2; p.vx = 0; p.vy = 0; p.regrab = false; p.levT = 0; p.levUsed = false; ev('rope');
        }
      }
    } else if (p.state === 'climb') {
      const g = p.facing > 0 ? grabR : grabL;
      p.coyote = 0;
      if (!g || p.stamina <= 0) {
        p.state = 'normal';
        if (p.stamina <= 0) ev('slip');
      } else if (p.buf > 0) {
        p.buf = 0;
        if (dirX === -p.facing) {
          p.vx = -p.facing * K.WJ_VX; p.vy = -K.WJ_VY; p.wjLock = K.WJ_LOCK; p.facing = -p.facing; p.state = 'normal';
          ev('walljump');
        } else {
          p.vy = -K.CJ_VY; p.vx = 0; p.stamina -= K.CJ_COST; p.state = 'normal'; p.regrab = true;
          ev('climbjump');
        }
      } else if (dirX === -p.facing && !inp.grab) {
        p.state = 'normal'; p.vx = -p.facing * 30;
      } else if (p.onGround && dirY > 0) {
        p.state = 'normal';
      } else {
        p.vx = 0;
        if (dirY < 0) {
          const ux = p.facing > 0 ? p.x + PW : p.x - 1;
          if (!rectAny(L, ux, p.y + 1, 1, 4, solid)) {
            p.state = 'normal'; p.vy = -K.HOP_VY; p.vx = p.facing * K.HOP_VX; p.wjLock = 0.14; p.hop = 0.2;
            ev('hop');
          } else { p.vy = -K.CLIMB_UP; p.stamina -= K.ST_UP * dt; }

// ===== SPR: arma los sprites de texto (técnica Cumbre) en canvas, con cambio de paleta para capas y variantes =====
const SPR = (function () {
  const RAMPS = {
    cloakG: ['#2a6036', '#408448', '#62ac5c'], cloakU: ['#2a3e70', '#3c5896', '#567ebe'],
    robe: ['#40286a', '#5a3c8e', '#7c5ab6'], gold: ['#b08022', '#e0b040', '#ffe07a']
  };
  const CLOAKS = [
    { id: 'verde', name: 'CAPA DEL BOSQUE', ramp: 'cloakG', need: 0 },
    { id: 'azul', name: 'CAPA DEL RÍO', ramp: 'cloakU', need: 30 },
    { id: 'purpura', name: 'CAPA DEL MAGO', ramp: 'robe', need: 75 },
    { id: 'dorada', name: 'CAPA DEL ORBE', ramp: 'gold', need: 120 }
  ].map(c => Object.assign(c, { cols: RAMPS[c.ramp] }));
  // filas con RLE ("K3a5"): se expanden una vez
  function rows(s) {
    if (s._r) return s._r;
    s._r = s.r.map(r => /\d/.test(r) ? r.replace(/(\D)(\d+)/g, (m, ch, n) => ch.repeat(+n)) : r);
    return s._r;
  }
  function make(name, palOverride, palName) {
    const s = SPRITES[name];
    if (!s) throw new Error('sprite ' + name);
    const pal = Object.assign({}, SPRITES.pal[palName || s.p], palOverride || {});
    const rr = rows(s), h = rr.length, w = rr[0].length;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    for (let r = 0; r < h; r++) for (let i = 0; i < w; i++) { const ch = rr[r][i]; if (ch !== '.') { x.fillStyle = pal[ch] || '#ff00ff'; x.fillRect(i, r, 1, 1); } }
    return c;
  }
  function flip(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }
  const pair = img => [img, flip(img)];
  const heroCache = {};
  function hero(ci) {
    if (heroCache[ci]) return heroCache[ci];
    const r = CLOAKS[ci].cols, o = { d: r[0], c: r[1], C: r[2] };
    const m = n => pair(make('hero_' + n, o));
    heroCache[ci] = {
      idle: [m('idle0'), m('idle1')], run: [m('run0'), m('run1'), m('run2'), m('run3')],
      jump: m('jump0'), fall: m('fall0'), climb: [m('climb0'), m('climb1')], rope: [m('rope0'), m('rope1')], slide: m('slide0')
    };
    return heroCache[ci];
  }
  // esqueleto arquero: el goblin con paleta de hueso (provisorio hasta su hoja de Gemini)
  const SKEL = { a: '#8a8478', b: '#c8c2ae', c: '#e8e2d0', e: '#1e1a22', f: '#322c36', g: '#4a4048', h: '#5e5048', i: '#ff4a3a' };
  // runas de cada jefe (cambio de paleta del cristal)
  const RUNES = {
    luz: { a: '#1a3a0a', d: '#7ad65a', f: '#c8f07a', h: '#f4ffd0' },
    fuego: { a: '#3a0a06', d: '#c8301a', f: '#fa6a0a', h: '#ffd541' },
    escarcha: {},
    sol: { a: '#3a2206', d: '#e0a020', f: '#ffd541', h: '#fff4c0' },
    alma: { a: '#0e1a3a', d: '#4a6aff', f: '#9ab4ff', h: '#e0e8ff' }
  };
  let base = null;
  function load() {
    if (base) return base;
    const fr = (pre, n) => [0, 1, 2, 3].slice(0, n).map(f => make(pre + f));
    base = {
      imp: fr('imp', 4), impDead: make('impDead'),
      goblin: [0, 1].map(f => pair(make('goblin' + f))), goblinAim: pair(make('goblinAim')), goblinShot: pair(make('goblinShot')), goblinDead: pair(make('goblinDead')),
      skel: [pair(make('skel0')), pair(make('skel0'))], skelAim: pair(make('skelAim')), skelShot: pair(make('skelShot')), skelDead: pair(make('skelDead')),
      gem: [0, 1, 2].map(f => make('gem' + f)), gemG: [0, 1, 2].map(f => make('gemG' + f)), potion: make('potion'),
      banner: [0, 1, 2].map(f => make('banner' + f)),
      anchor: [make('anchor0'), make('anchor1')], rune: {},
      // voladores por etapa: [cuadros], muerto
      fly: {
        bat: { f: fr('bat', 4).map(pair), dead: pair(make('batDead')) },
        batT: { f: [0, 1, 2, 3].map(k => pair(make('bat' + k, null, 'batT'))), dead: pair(make('batDead', null, 'batT')) },
        icebat: { f: fr('ibat', 4).map(pair), dead: pair(make('ibatDead')) },
        squirrel: { f: fr('sq', 4).map(pair), dead: pair(make('sqDead')) },
        firesq: { f: fr('fsq', 4).map(pair), dead: pair(make('fsqDead')) },
        moth: { f: fr('moth', 4).map(pair), dead: pair(make('mothDead')) },
        imp: null
      },
      ghost: fr('ghost', 4), ghostDead: make('ghostDead'), wisp: fr('wisp', 4), wispDead: make('wispDead'),
      ape: {}
    };
    base.fly.imp = { f: base.imp.map(pair), dead: pair(base.impDead) };
    for (const k of ['luz', 'fuego', 'escarcha', 'alma']) base.rune[k] = [make('rune_' + k + '0'), make('rune_' + k + '1')];
    base.rune.sol = [make('rune_luz0', null, 'runeSol'), make('rune_luz1')];
    for (const [k, p] of [['N', 'ape'], ['F', 'apeF'], ['V', 'apeV']]) {
      const m = n => pair(make(n, null, p));
      base.ape[k] = { idle: [m('ape0'), m('ape1')], aim: m('apeAim'), shot: m('apeShot'), dead: m('apeDead') };
    }
    return base;
  }
  const bossCache = {};
  function boss(id) {
    id = id || 'golem';
    if (bossCache[id]) return bossCache[id];
    const has = n => !!SPRITES[id + '_' + n];
    const g = n => make(id + '_' + n);
    const o = { idle: [g('idle0')], throw: g('throw'), slamUp: g('slamUp'), slamDown: g('slamDown'), beam: g('beam'), stone: g('stone') };
    if (has('idle1') && id !== 'espectro') o.idle.push(g('idle1'));
    if (id === 'espectro') o.swoop = g('idle1');
    o.roar = has('roar') ? g('roar') : o.slamUp;
    bossCache[id] = o;
    return o;
  }
  return { CLOAKS, hero, load, boss, make, pair };
})();

  // ---------- tiles ----------

  function vein(x, ox, oy, R) {

  function capOn(x, ox, oy, th, R) {

  // muro enano: sillares de piedra

  // ---------- fondos ----------
  function makeRange(w, h, seed, rough, peaks, jag) {

    x.fillStyle = '#ffffff';

  function makePines(w, h, seed, dense) {

    ctx.globalAlpha = 1;
    const H = hero, hi = Math.floor(animT * 2) % 2 ? H.jump[0] : H.idle[0][0];
    ctx.drawImage(hi, 140 - (hi.width - 1) / 2, gy - hi.height);
    const bx = 152, top = gy - 30;
    ctx.fillStyle = '#9a6a36'; ctx.fillRect(bx, top, 1, 30);
    for (let i = 0; i < 12; i++) for (let j = 0; j < 9; j++) { const wy = Math.round(Math.sin(animT * 6 - i * 0.6) * 1.3 * (i / 12)); let c = (j === 0 || j === 8) ? '#f2c230' : '#4a2a7a'; if (Math.hypot(i - 6, j - 4) < 2.2) c = Math.hypot(i - 6, j - 4) < 1.2 ? '#ffffff' : '#7ef3ff'; ctx.fillStyle = c; ctx.fillRect(bx + 1 + i, top + j + wy, 1, 1); }
    if (last) for (let k = 0; k < 14; k++) { const t = (animT * 0.3 + k / 14) % 1; ctx.globalAlpha = 1 - t; ctx.fillStyle = k % 2 ? '#bff4ff' : '#6ad0ff'; ctx.fillRect(Math.round(20 + (k * 53) % 150 + Math.sin(animT + k) * 8), Math.round(gy - t * (gy - 10)), 2, 2); }
    ctx.globalAlpha = 1;
    if (clearT > 2.5 && Math.floor(animT * 2) % 2 === 0) FONT.draw(ctx, (touchMode ? 'TOCA PARA ' : 'ENTER PARA ') + (last ? 'VOLVER' : 'SEGUIR SUBIENDO'), VW / 2, VH - 14, COL.cream, { align: 'center', outline: COL.ink });
    if (clearT > 2.5) hits.push({ x: 0, y: 0, w: VW, h: VH, fn: () => { edge.ok = true; } });
  }

  // ---------- bucle ----------
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0, frameDt = 1 / 60;
  function tick() {
    const [inp, m] = input();
    if (state === 'play') updatePlay(STEP, inp, m);
    else if (state === 'title') updateTitle(STEP, inp, m);
    else if (state === 'select') updateSelect(STEP, inp, m);
    else if (state === 'cloaks') updateCloaks(STEP, inp, m);
    else if (state === 'help') updateHelp(STEP, inp, m);
    else if (state === 'pause') updatePause(STEP, inp, m);
    else if (state === 'clear') updateClear(STEP, inp, m);
    else if (state === 'ending') updateEnding(STEP, inp, m);
    else if (state === 'story') updateStory(STEP, inp, m);
    else if (state === 'cloud') updateCloud(STEP, inp, m);
  }
  function render() {
    hits = [];
    ctx.imageSmoothingEnabled = false;
    if (state === 'play') renderPlay();
    else if (state === 'title') renderTitle();
    else if (state === 'select') renderSelect();
    else if (state === 'cloaks') renderCloaks();
    else if (state === 'help') renderHelp();
    else if (state === 'pause') renderPause();
    else if (state === 'clear') renderClear();
    else if (state === 'ending') renderEnding();
    else if (state === 'story') renderStory();
    else if (state === 'cloud') renderCloud();
    if (toastT > 0) { toastT -= 1 / 60; const ls = FONT.wrap(toastMsg, VW - 28), h = ls.length * 10 + 8, y = VH - h - 26; ctx.globalAlpha = Math.min(1, toastT * 3); ctx.fillStyle = 'rgba(10,20,34,0.92)'; ctx.fillRect(8, y, VW - 16, h); ctx.fillStyle = COL.rune; ctx.fillRect(8, y, VW - 16, 1); ls.forEach((l, i) => FONT.draw(ctx, l, VW / 2, y + 5 + i * 10, COL.cream, { align: 'center' })); ctx.globalAlpha = 1; }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    frameDt = dt; acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { tick(); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    render();
  }
  setupTouch();
  layout();
  document.getElementById('mMute').textContent = save.muted ? '♪ NO' : '♪ SÍ';
  AUDIO.play('titulo');
  requestAnimationFrame(frame);

  // gancho para pruebas automáticas
  window.__EE = {
    start: i => { startLevel(i); introT = 0; },
    get state() { return state; }, get player() { return player; }, get L() { return L; }, get B() { return B; }, get E() { return E; },
    teleport: (x, y) => { player.x = x; player.y = y; player.vx = 0; player.vy = 0; player.apexY = y; cam = clampCam(y - VH * 0.6); },
    clear: () => levelClear(), setState: (s, k) => { state = s; clearT = 5; menuIdx = 0; if (k !== undefined) { endStage = k; storyI = k; storyT = 0; storyNext = k * 10; menuIdx = s === 'select' ? k * 10 : 0; } },
    story: k => { state = 'story'; storyI = k; storyT = 0; storyNext = k * 10; }, cam: y => { cam = clampCam(y); },
    sim: (inp, n, nh) => { noHaz = !!nh; for (let k = 0; k < n; k++) { if (state !== 'play') break; if (nh) player.lev = false; updatePlay(STEP, inp, {}); } noHaz = false; return state; },
    powers: (lev, hearts) => { save.lev = lev; save.hearts = hearts; },
    get falls() { return falls; }, get time() { return time; }, get got() { return got; },
    unlockAll: () => { save.unlocked = LEVELS.length; writeSave(); }, keys,
    skipBoss: () => { if (B) { B.st = 'fight'; B.rise = 1; B.atk = 2; freezeInput = 0; } }
  };
})();
